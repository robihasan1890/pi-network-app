[10:53 am, 09/11/2026] MD RABIUL ISLAM: <!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PiConnect BD</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
<div class="wrap">
  <h1>PiConnect BD</h1>
  <p class="sub">Pi দিয়ে কেনা-বেচা ও সেবা বিনিময়</p>
  <div id="status"></div>

  <section id="loginBox">
    <p>পোস্ট করতে ও যোগাযোগ করতে Pi দিয়ে লগইন করুন।</p>
    <button id="loginBtn" type="button">Pi দিয়ে লগইন করুন</button>
  </section>

  <section id="appBox">
    <div class="bar">
      <span>স্বাগতম, <strong id="uname"></strong></span>
      <button class="ghost" type="button" id="newBtn">+ নতুন পোস্ট</button>
    </div>

    <form id="postForm">
      <label>ধরন
        <select id="type">
          <option value="বিক্রি">বিক্রি (পণ্য)</option>
          <option value="কেনা">কিনতে চাই</option>
          <option value="সেবা">সেবা</option>
        </select>
      </label>
      <label>শিরোনাম
        <input id="title" maxlength="80" required placeholder="যেমন: ব্যবহৃত মোবাইল / লোড সেবা">
      </label>
      <label>বিবরণ
        <textarea id="desc" maxlength="500" placeholder="সংক্ষেপে লিখুন..."></textarea>
      </label>
      <label>দাম (Pi)
        <input id="price" type="number" min="0" step="0.01" value="0.5" required>
      </label>
      <label>এলাকা
        <input id="area" maxlength="40" required placeholder="যেমন: রংপুর">
      </label>
      <button type="submit" id="submitBtn">পোস্ট করুন</button>
    </form>

    <div class="tabs">
      <button type="button" class="ghost" data-f="all">সব</button>
      <button type="button" class="ghost" data-f="বিক্রি">বিক্রি</button>
      <button type="button" class="ghost" data-f="কেনা">কেনা</button>
      <button type="button" class="ghost" data-f="সেবা">সেবা</button>
    </div>
    <div id="list"></div>
  </section>
</div>

<script>
(function () {
  "use strict";

  var SUPABASE_URL = "https://llcxjoaplqnfmhwbcclb.supabase.co";
  var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxsY3hqb2FwbHFuZm1od2JjY2xiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQxMjkwOTEsImV4cCI6MjEwOTcwNTA5MX0.ZCmPN0mIuozeYmY7coba1zsV50Jv7WOL94-PivM7Yho";

  var RULES = {
    "*": "box-sizing:border-box",
    "body": "margin:0;font-family:'Noto Sans Bengali',system-ui,sans-serif;background:#14121c;color:#f1eefb;line-height:1.5",
    ".wrap": "max-width:560px;margin:0 auto;padding:16px",
    "h1": "margin:0;font-size:24px;color:#f5a524",
    ".sub": "color:#a49fba;margin:4px 0 16px",
    "button": "font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:#f5a524;color:#1a1200;font-weight:600",
    "button.ghost": "background:transparent;color:#f1eefb;border:1px solid #342f47",
    ".bar": "display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px",
    ".msg": "padding:10px 12px;border-radius:10px;margin:8px 0;font-size:14px",
    ".msg.err": "background:#3a1d22;color:#f87171",
    ".msg.ok": "background:#16301f;color:#4ade80",
    "form": "display:grid;gap:10px;background:#1f1c2b;border:1px solid #342f47;border-radius:14px;padding:14px;margin-bottom:16px",
    "label": "display:grid;gap:4px;font-size:13px;color:#a49fba",
    "input,select,textarea": "font:inherit;width:100%;padding:10px;border-radius:8px;border:1px solid #342f47;background:#12101a;color:#f1eefb",
    "textarea": "min-height:80px;resize:vertical",
    ".tabs": "display:flex;gap:8px;margin-bottom:12px",
    ".tabs button": "flex:1",
    ".post": "background:#1f1c2b;border:1px solid #342f47;border-radius:14px;padding:14px;margin-bottom:10px",
    ".post h3": "margin:0 0 4px;font-size:17px",
    ".tag": "display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#2c2740;color:#f5a524;margin-bottom:6px",
    ".meta": "font-size:13px;color:#a49fba;margin-top:8px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px",
    ".price": "color:#f5a524;font-weight:700",
    ".empty": "text-align:center;color:#a49fba;padding:28px 0"
  };

  function applyStyles(root) {
    Object.keys(RULES).forEach(function (sel) {
      var decls = RULES[sel].split(";");
      var nodes = [];
      try { nodes = root.querySelectorAll(sel); } catch (e) {}
      nodes.forEach(function (el) {
        decls.forEach(function (d) {
          var i = d.indexOf(":");
          if (i > 0) el.style.setProperty(d.slice(0, i).trim(), d.slice(i + 1).trim());
        });
      });
    });
  }
  function setShow(el, on, disp) { el.style.display = on ? (disp || "block") : "none"; }

  var $ = function (id) { return document.getElementById(id); };
  var user = null, filter = "all";

  document.documentElement.style.background = "#14121c";
  applyStyles(document);
  setShow($("appBox"), false);
  setShow($("postForm"), false);

  function show(text, kind) {
    var s = $("status");
    s.innerHTML = "";
    if (!text) return;
    var d = document.createElement("div");
    d.className = "msg " + (kind || "");
    d.textContent = text;
    s.appendChild(d);
    applyStyles(s);
  }

  // ---------- Supabase ----------
  function sb(path, opts) {
    opts = opts || {};
    var h = {
      "apikey": SUPABASE_KEY,
      "Content-Type": "application/json"
    };
    if (SUPABASE_KEY.indexOf("eyJ") === 0) {
      h["Authorization"] = "Bearer " + SUPABASE_KEY;
    }
    opts.headers = Object.assign(h, opts.headers || {});
    return fetch(SUPABASE_URL + "/rest/v1/" + path, opts).then(function (r) {
      if (!r.ok) return r.text().then(function (t) { throw new Error("সার্ভার এরর " + r.status + ": " + t); });
      return r.status === 204 ? null : r.json().catch(function () { return null; });
    });
  }

  // ---------- Pi SDK ----------
  var sdkReady = false;
  try {
    if (typeof Pi === "undefined") throw new Error("Pi SDK লোড হয়নি");
    Pi.init({ version: "2.0" });
    sdkReady = true;
  } catch (e) {
    show("এই অ্যাপ Pi Browser-এ খুলুন। সাধারণ ব্রাউজারে লগইন কাজ করবে না।", "err");
  }

  function onIncompletePaymentFound(payment) {}

  async function login() {
    if (!sdkReady) { show("Pi SDK পাওয়া যায়নি। Pi Browser-এ খুলুন।", "err"); return; }
    var btn = $("loginBtn");
    btn.disabled = true;
    show("লগইন হচ্ছে...");
    try {
      var auth = await Pi.authenticate(["username"], onIncompletePaymentFound);
      user = auth.user;
      $("uname").textContent = "@" + user.username;
      setShow($("loginBox"), false);
      setShow($("appBox"), true);
      show("");
      loadPosts();
    } catch (err) {
      console.error(err);
      show("লগইন ব্যর্থ: " + (err && err.message ? err.message : err), "err");
    } finally {
      btn.disabled = false;
    }
  }
  $("loginBtn").addEventListener("click", login);
  window.login = login;

  // ---------- পোস্ট ----------
  var cache = [];

  function loadPosts() {
    $("list").innerHTML = "";
    var l = document.createElement("div");
    l.className = "empty"; l.textContent = "লোড হচ্ছে...";
    $("list").appendChild(l); applyStyles($("list"));
    var q = "posts?select=*&order=created_at.desc&limit=100";
    if (filter !== "all") q += "&type=eq." + encodeURIComponent(filter);
    sb(q).then(function (rows) {
      cache = rows || [];
      render();
    }).catch(function (e) {
      show("পোস্ট লোড করা যায়নি। " + e.message, "err");
      $("list").innerHTML = "";
    });
  }

  $("newBtn").addEventListener("click", function () {
    var f = $("postForm");
    setShow(f, f.style.display === "none", "grid");
  });

  $("postForm").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var sbtn = $("submitBtn");
    sbtn.disabled = true;
    var body = {
      type: $("type").value,
      title: $("title").value.trim(),
      descr: $("desc").value.trim(),
      price: parseFloat($("price").value) || 0,
      area: $("area").value.trim(),
      owner: user.username
    };
    sb("posts", { method: "POST", body: JSON.stringify(body), headers: { "Prefer": "return=minimal" } })
      .then(function () {
        ev.target.reset();
        $("price").value = "0.5";
        setShow($("postForm"), false);
        show("পোস্ট হয়েছে।", "ok");
        setTimeout(function () { show(""); }, 2000);
        loadPosts();
      })
      .catch(function (e) { show("পোস্ট করা যায়নি। " + e.message, "err"); })
      .then(function () { sbtn.disabled = false; });
  });

  document.querySelectorAll(".tabs button").forEach(function (b) {
    b.addEventListener("click", function () { filter = b.getAttribute("data-f"); loadPosts(); });
  });

  function render() {
    var list = $("list");
    list.innerHTML = "";
    if (!cache.length) {
      var e = document.createElement("div");
      e.className = "empty";
      e.textContent = "এখনো কোনো পোস্ট নেই। প্রথম পোস্টটি আপনি করুন।";
      list.appendChild(e);
      applyStyles(list);
      return;
    }
    cache.forEach(function (p) {
      var c = document.createElement("div"); c.className = "post";
      var tag = document.createElement("span"); tag.className = "tag"; tag.textContent = p.type;
      var h = document.createElement("h3"); h.textContent = p.title;
      var d = document.createElement("div"); d.textContent = p.descr || "";
      var m = document.createElement("div"); m.className = "meta";
      var l = document.createElement("span"); l.textContent = p.area + " · @" + p.owner;
      var pr = document.createElement("span"); pr.className = "price"; pr.textContent = p.price + " Pi";
      m.appendChild(l); m.appendChild(pr);
      c.appendChild(tag); c.appendChild(h); c.appendChild(d); c.appendChild(m);
      list.appendChild(c);
    });
    applyStyles(list);
  }
})();
</script>
</body>
</html>
