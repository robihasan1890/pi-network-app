[6:12 pm, 08/11/2026] MD RABIUL ISLAM: <!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PiConnect BD</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
  :root{--bg:#14121c;--card:#1f1c2b;--line:#342f47;--text:#f1eefb;--mute:#a49fba;--accent:#f5a524;--ok:#4ade80;--err:#f87171}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Sans Bengali",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
  .wrap{max-width:560px;margin:0 auto;padding:16px}
  h1{margin:0;font-size:24px;color:var(--accent)}
  .sub{color:var(--mute);margin:4px 0 16px}
  button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--accent);color:#1a1200;font-weight:600}
  button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
  button:disabled{opacity:.5}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
  .msg{padding:10px 12px;border-radius:10px;margin:8px 0;font-size:14px}
  .msg.err{background:#3a1d22;color:var(--err)}
  .msg.ok{background:#16301f;color:var(--ok)}
  form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px;display:grid;gap:10px}
  label{font-size:13px;color:var(--mute);display:grid;gap:4px}
  input,select,textarea{font:inherit;width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#12101a;color:var(--text)}
  textarea{min-height:80px;resize:vertical}
  .tabs{display:flex;gap:8px;margin-bottom:12px}
  .tabs button{flex:1}
  .post{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
  .post h3{margin:0 0 4px;font-size:17px}
  .tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#2c2740;color:var(--accent);margin-right:6px}
  .meta{font-size:13px;color:var(--mute);margin-top:8px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
  .price{color:var(--accent);font-weight:700}
  .hidden{display:none}
  .empty{text-align:center;color:var(--mute);padding:28px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>PiConnect BD</h1>
  <p class="sub">Pi দিয়ে কেনা-বেচা ও সেবা বিনিময়</p>

  <div id="status"></div>

  <!-- লগইন -->
  <section id="loginBox">
    <p>পোস্ট করতে ও যোগাযোগ করতে Pi দিয়ে লগইন করুন।</p>
    <button id="loginBtn" type="button">Pi দিয়ে লগইন করুন</button>
  </section>

  <!-- মূল অ্যাপ -->
  <section id="appBox" class="hidden">
    <div class="bar">
      <span>স্বাগতম, <strong id="uname"></strong></span>
      <button class="ghost" type="button" id="newBtn">+ নতুন পোস্ট</button>
    </div>

    <form id="postForm" class="hidden">
      <label>ধরন
        <select id="type">
          <option value="বিক্রি">বিক্রি (পণ্য)</option>
          <option value="কেনা">কিনতে চাই</option>
          <option value="সেবা">সেবা</option>
        </select>
      </label>
      <label>শিরোনাম
        <input id="title" maxlength="80" required placeholder="যেমন: ব্যবহৃত মোবাইল / লোড সেবা">
      </label>
      <label>বিবরণ
        <textarea id="desc" maxlength="500" placeholder="সংক্ষেপে লিখুন..."></textarea>
      </label>
      <label>দাম (Pi)
        <input id="price" type="number" min="0" step="0.01" value="0.5" required>
      </label>
      <label>এলাকা
        <input id="area" maxlength="40" required placeholder="যেমন: রংপুর">
      </label>
      <button type="submit">পোস্ট করুন</button>
    </form>

    <div class="tabs">
      <button type="button" class="ghost" data-f="all">সব</button>
      <button type="button" class="ghost" data-f="বিক্রি">বিক্রি</button>
      <button type="button" class="ghost" data-f="কেনা">কেনা</button>
      <button type="button" class="ghost" data-f="সেবা">সেবা</button>
    </div>
    <div id="list"></div>
  </section>
</div>

<script>
(function () {
  "use strict";

  var user = null;
  var filter = "all";
  var KEY = "piconnectbd_posts_v1";

  var $ = function (id) { return document.getElementById(id); };

  function show(text, kind) {
    var s = $("status");
    s.innerHTML = "";
    if (!text) return;
    var d = document.createElement("div");
    d.className = "msg " + (kind || "");
    d.textContent = text;
    s.appendChild(d);
  }

  // ---- Pi SDK চালু ----
  var sdkReady = false;
  try {
    if (typeof Pi === "undefined") throw new Error("Pi SDK লোড হয়নি");
    Pi.init({ version: "2.0" });
    sdkReady = true;
  } catch (e) {
    show("এই অ্যাপ Pi Browser-এ খুলুন। সাধারণ ব্রাউজারে লগইন কাজ করবে না।", "err");
  }

  // ---- লগইন ----
  function onIncompletePaymentFound(payment) { /* পেমেন্ট যোগ করলে এখানে হ্যান্ডেল করুন */ }

  async function login() {
    if (!sdkReady) {
      show("Pi SDK পাওয়া যায়নি। Pi Browser-এ লিংকটি খুলুন।", "err");
      return;
    }
    var btn = $("loginBtn");
    btn.disabled = true;
    show("লগইন হচ্ছে...");
    try {
      var auth = await Pi.authenticate(["username"], onIncompletePaymentFound);
      user = auth.user;
      $("uname").textContent = "@" + user.username;
      $("loginBox").classList.add("hidden");
      $("appBox").classList.remove("hidden");
      show("লগইন সফল হয়েছে।", "ok");
      setTimeout(function () { show(""); }, 2500);
      render();
    } catch (err) {
      console.error(err);
      show("লগইন ব্যর্থ: " + (err && err.message ? err.message : err), "err");
    } finally {
      btn.disabled = false;
    }
  }
  $("loginBtn").addEventListener("click", login);
  window.login = login; // পুরনো onclick="login()" থাকলেও কাজ করবে

  // ---- পোস্ট সংরক্ষণ (এই ডিভাইসে) ----
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; }
  }
  function save(arr) {
    try { localStorage.setItem(KEY, JSON.stringify(arr)); } catch (e) { show("সংরক্ষণ করা যায়নি", "err"); }
  }

  $("newBtn").addEventListener("click", function () {
    $("postForm").classList.toggle("hidden");
  });

  $("postForm").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var posts = load();
    posts.unshift({
      id: Date.now(),
      type: $("type").value,
      title: $("title").value.trim(),
      desc: $("desc").value.trim(),
      price: parseFloat($("price").value) || 0,
      area: $("area").value.trim(),
      owner: user.username,
      at: new Date().toISOString()
    });
    save(posts);
    ev.target.reset();
    $("price").value = "0.5";
    $("postForm").classList.add("hidden");
    show("পোস্ট হয়েছে।", "ok");
    setTimeout(function () { show(""); }, 2000);
    render();
  });

  document.querySelectorAll(".tabs button").forEach(function (b) {
    b.addEventListener("click", function () { filter = b.getAttribute("data-f"); render(); });
  });

  function render() {
    var list = $("list");
    list.innerHTML = "";
    var posts = load().filter(function (p) { return filter === "all" || p.type === filter; });
    if (!posts.length) {
      var e = document.createElement("div");
      e.className = "empty";
      e.textContent = "এখনো কোনো পোস্ট নেই। প্রথম পোস্টটি আপনি করুন।";
      list.appendChild(e);
      return;
    }
    posts.forEach(function (p) {
      var c = document.createElement("div");
      c.className = "post";

      var tag = document.createElement("span");
      tag.className = "tag"; tag.textContent = p.type;
      var h = document.createElement("h3");
      h.textContent = p.title;
      var d = document.createElement("div");
      d.textContent = p.desc;
      var m = document.createElement("div");
      m.className = "meta";
      var left = document.createElement("span");
      left.textContent = p.area + " · @" + p.owner;
      var pr = document.createElement("span");
      pr.className = "price"; pr.textContent = p.price + " Pi";
      m.appendChild(left); m.appendChild(pr);

      c.appendChild(tag); c.appendChild(h); c.appendChild(d); c.appendChild(m);

      if (user && p.owner === user.username) {
        var del = document.createElement("button");
        del.className = "ghost"; del.type = "button"; del.textContent = "মুছুন";
        del.style.marginTop = "10px";
        del.addEventListener("click", function () {
          save(load().filter(function (x) { return x.id !== p.id; }));
          render();
        });
        c.appendChild(del);
      }
      list.appendChild(c);
    });
  }
})();
</script>
</body>
</html>
